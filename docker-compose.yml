services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # MinIO bucket setup (runs once then exits). The minio image ships no mc or curl,
  # so there is no healthcheck to wait on; this loop retries until the server answers.
  # restart: "no" keeps it from re-running on `docker compose restart`.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/stf-receipts;
      mc anonymous set none local/stf-receipts;
      echo 'MinIO bucket ready.';
      "

volumes:
  postgres_data:
  minio_data:
